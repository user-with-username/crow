[package]
name = "crow-cli"
version = "0.2.23"
edition = "2021"

[[bin]]
name = "crow"
path = "src/main.rs"

[dependencies]
crow-core = { path = "../crow-core" }
crow-utils = { path = "../crow-utils" }
anyhow = { workspace = true }
clap = { workspace = true }
rayon = { workspace = true }
once_cell = "1.21.3"
dialoguer = "0.12.0"
toml_edit = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.8"