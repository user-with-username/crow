name: Build

on:
  push:
    branches: ['*']

env:
  BIN_NAME: "crow"

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: linux-arm64
            use-cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-arm64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x64.exe

          - os: windows-latest
            target: i686-pc-windows-msvc
            artifact: windows-x86.exe

    steps:
      - uses: actions/checkout@v4

      - name: Setup cross-compile
        if: matrix.use-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
      
      - name: Install rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.target }}
          toolchain: stable

      - name: Build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          
          mkdir -p release
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            EXT=".exe"
          else
            EXT=""
          fi
          
          cp "target/${{ matrix.target }}/release/$BIN_NAME$EXT" "release/${{ matrix.artifact }}"

      - name: Upload bins
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download bins
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Bump patch version in crates
        id: bump
        run: |
          bump_patch() {
            local crate=$1
            local current=$(grep -m1 '^version =' $crate/Cargo.toml | cut -d '"' -f2)
            local major=$(echo $current | cut -d. -f1)
            local minor=$(echo $current | cut -d. -f2)
            local patch=$(echo $current | cut -d. -f3)
            local new_patch=$((patch + 1))
            local new_version="${major}.${minor}.${new_patch}"
            
            sed -i "0,/^version = \"${current}\"/s//version = \"${new_version}\"/" $crate/Cargo.toml
            
            echo "Bumped $crate: $current -> $new_version"
          }
          
          bump_patch "crow-utils"
          bump_patch "crow-core"
          bump_patch "crow-cli"
          
          version=$(grep -m1 '^version =' crow-cli/Cargo.toml | cut -d '"' -f2)
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "New version: ${version}"
          
      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add crow-utils/Cargo.toml crow-core/Cargo.toml crow-cli/Cargo.toml
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bump version to ${{ steps.bump.outputs.version }}"
            git pull --rebase origin ${GITHUB_REF#refs/heads/}
            git push origin HEAD:${GITHUB_REF#refs/heads/}
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: "v${{ steps.bump.outputs.version }}"
          body: |
            Build for version ${{ steps.bump.outputs.version }}.
            
            Thank you for using crow!
          files: |
            artifacts/linux-x86_64
            artifacts/linux-arm64
            artifacts/macos-x86_64
            artifacts/macos-arm64
            artifacts/windows-x64.exe
            artifacts/windows-x86.exe
          draft: false
          prerelease: false